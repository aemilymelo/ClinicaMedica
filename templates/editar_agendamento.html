<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Agendamento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit.css') }}">
</head>
<body>
    <div class="container">
        <h1>Editar Agendamento</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('agendamento.atualizar_agendamento', id=agendamento.id) }}" method="post" class="form">
            <label for="paciente">Paciente:</label>
            <input type="text" name="paciente" id="paciente" value="{{ agendamento.paciente.nome }}" readonly><br>
            
            <label for="data_horario">Data e Hora:</label>
            <input type="datetime-local" name="data_horario" id="data_horario" value="{{ agendamento.data_horario.strftime('%Y-%m-%dT%H:%M') }}" required><br>
            
            <label for="status">Status:</label>
            <select name="status" id="status">
                <option value="Pendente" {% if agendamento.status == 'Pendente' %}selected{% endif %}>Pendente</option>
                <option value="Confirmado" {% if agendamento.status == 'Confirmado' %}selected{% endif %}>Confirmado</option>
                <option value="Cancelado" {% if agendamento.status == 'Cancelado' %}selected{% endif %}>Cancelado</option>
            </select><br>
            
            <button type="submit" class="submit-btn">Salvar</button>
            <button type="button" class="btn btn-secondary" onclick="history.back()">Voltar</button>
        </form>
    </div>
</body>
</html>
